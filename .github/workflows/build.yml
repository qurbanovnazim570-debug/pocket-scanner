name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with Docker Buildozer
        uses: addnab/docker-run-action@v3
        with:
          image: kivy/buildozer:latest
          options: -v ${{ github.workspace }}:/home/user/hostpython
          run: |
            buildozer init
            sed -i 's/requirements = python3,kivy/requirements = python3,kivy,opencv-python,numpy/' buildozer.spec
            sed -i 's/#android.permissions = INTERNET/android.permissions = CAMERA,INTERNET/' buildozer.spec
            sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
            buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketScanner-APK
          path: bin/*.apk
