name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev gzip tar
          pip install --upgrade pip setuptools buildozer cython==0.29.33

      - name: Build APK with Buildozer
        run: |
          buildozer init
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,opencv-python,numpy/' buildozer.spec
          sed -i 's/#android.permissions = INTERNET/android.permissions = CAMERA,INTERNET/' buildozer.spec
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: PocketScanner-APK
          path: bin/*.apk
